name: build-and-test

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Rebuild dataset from raw files
        run: python scripts/build_dataset.py
      - name: Committed outputs must match a fresh build
        run: git diff --exit-code -- data/processed results manuscript/generated
      - name: Tests
        run: python -m unittest discover -s tests -v
